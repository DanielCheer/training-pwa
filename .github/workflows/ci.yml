name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    name: Harness (demo data, ${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # UTC has no DST; Toronto does - a date bug that only shows across a DST change fails one of them
        tz: [UTC, America/Toronto]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the checkout has no private/ overlay, so this is the public demo path
      - run: node harness/harness.js

  pytest:
    name: pytest (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-dev.txt
      - run: pytest
